services:
  db:
    image: pgvector/pgvector:pg16
    container_name: margin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: margin_dev_password
      POSTGRES_DB: margin
    ports:
      - "5432:5432"
    volumes:
      - margin_pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin -d margin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  margin_pgdata:

