# Margin — Render Blueprint
#
# Deploy the full stack in one click: backend (FastAPI), frontend (static
# React/Vite), and a managed PostgreSQL + pgvector database.
#
# First-deploy steps:
#   1. Push this file to your repo.
#   2. In Render → New → Blueprint, point it at the repo.
#   3. Fill in the env vars marked `sync: false` (DATABASE_URL, GROQ_API_KEY,
#      GEMINI_API_KEY, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY).
#   4. Deploy. Once both services get URLs, update CORS_ORIGINS (backend)
#      and VITE_API_BASE_URL (frontend) to the real Render URLs and
#      redeploy. CREDENTIAL_ENCRYPTION_SECRET is auto-generated and should
#      never be changed after documents/SQL connections exist.

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + PydanticAI
  # ---------------------------------------------------------------------------
  - type: web
    name: margin-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    # NOTE: Render Free tier has NO persistent disk. Uploaded files are stored
    # on the container's ephemeral filesystem and are LOST on every restart or
    # spin-down (the service idles out after 15 minutes). To keep uploads,
    # either upgrade to a paid plan and re-add a `disk` block, or swap the
    # local storage adapter for S3/R2.
    envVars:
      - key: APP_ENV
        value: Production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # Database connection — use a Neon Postgres URL (free tier works, supports
      # pgvector). The app auto-normalizes Neon's `sslmode=require` param for
      # asyncpg. Secret — set in the Render dashboard, never commit it here.
      - key: DATABASE_URL
        sync: false

      # File storage — Cloudflare R2 (S3-compatible). On the Free tier, local
      # storage is ephemeral; R2 keeps uploads across restarts.
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        value: margin
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        value: https://7028480a2954eff360ed9a906d81f395.r2.cloudflarestorage.com
      # Secrets — set these in the Render dashboard, never commit them here.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_KEY_PREFIX
        value: documents
      # Only used when STORAGE_PROVIDER=local.
      - key: STORAGE_DIR
        value: /tmp/margin-uploads

      # Upload & document limits.
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "20971520"
      - key: MAX_PAGES_PER_DOCUMENT
        value: "150"
      - key: MAX_DOCUMENTS_PER_SESSION
        value: "25"

      # RAG chunking.
      - key: CHUNK_TARGET_CHARS
        value: "1200"
      - key: CHUNK_OVERLAP_CHARS
        value: "200"
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: SELECTION_SURROUNDING_WINDOW
        value: "1"

      # LLM provider for reasoning, citations, and SQL. "groq" (Groq, uses
      # GROQ_API_KEY), "grok" (xAI, uses XAI_API_KEY), or "gemini".
      - key: LLM_PROVIDER
        value: groq
      # Secret — set in the Render dashboard, never commit it here.
      - key: GROQ_API_KEY
        sync: false
      - key: GROK_MODEL
        value: openai/gpt-oss-120b
      - key: GROK_API_BASE
        value: https://api.groq.com/openai/v1
      - key: GROK_TIMEOUT_SECONDS
        value: "30.0"

      # Gemini — embeddings are always required (regardless of LLM provider).
      # Secret — set in the Render dashboard, never commit it here.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_GENERATION_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSION
        value: "768"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30.0"

      # SQL Assistant security. CREDENTIAL_ENCRYPTION_SECRET is auto-generated
      # and must stay fixed after first deploy (changing it makes stored
      # connection URLs undecryptable).
      - key: CREDENTIAL_ENCRYPTION_SECRET
        generateValue: true
      - key: SQL_ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: SQL_QUERY_TIMEOUT_SECONDS
        value: "5.0"
      - key: SQL_MAX_ROWS
        value: "100"

      # CORS — UPDATE AFTER FIRST DEPLOY to the real frontend URL, e.g.
      #   https://margin-frontend.onrender.com
      - key: CORS_ORIGINS
        value: "https://margin-frontend.onrender.com"

  # ---------------------------------------------------------------------------
  # Frontend — static React + Vite build
  # ---------------------------------------------------------------------------
  - type: web
    name: margin-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # SPA client-side routing: serve index.html for any path that isn't a real
    # file, so deep links (/library, /reader/:id, /sql) survive a refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # UPDATE AFTER FIRST DEPLOY to the real backend URL, e.g.
      #   https://margin-backend.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        value: "https://margin-backend.onrender.com/api/v1"

# -----------------------------------------------------------------------------
# Database — uses Neon (external) instead of Render-managed Postgres.
# In your Neon project:
#   1. Enable the `vector` extension: CREATE EXTENSION vector;
#   2. Run migrations from your local machine or via Render's preDeployCommand:
#        DATABASE_URL=<neon-url> alembic upgrade head
#   3. Paste the Neon connection string into the backend's DATABASE_URL env var
#      (above) — the app handles Neon's `sslmode=require` automatically.
# Neon free tier: no 90-day expiry, autoscales to zero, supports pgvector.
# -----------------------------------------------------------------------------
# (No Render `databases` block — Neon is managed separately.)
