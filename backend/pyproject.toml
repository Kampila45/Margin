[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-backend"
version = "0.1.0"
description = "Margin — AI-powered document reader and grounded RAG backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.3.5,<1.0.0",
    "alembic>=1.13.3,<2.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pydantic-ai-slim[groq,google]>=2.68.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
